<header [class.scrolled]="isScrolled()">
  <div class="container navbar">
    <a routerLink="/" class="logo">
      <img src="/Axione_Logo.webp" alt="Axione Solutions" />
    </a>

    <nav class="nav-menu" [class.active]="mobileMenuOpen()">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Home
      </a>

      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"> About Us</a>

      <div class="nav-dropdown">
        <a routerLink="/services" routerLinkActive="active" class="dropdown-toggle">
          Services
          <i class="ri-arrow-down-s-line"></i>
        </a>

        <div class="dropdown-menu">
          <a routerLink="/services/agentic-ai" (click)="closeMenu()"> Agentic AI </a>
          <a routerLink="/services/ai-automation" (click)="closeMenu()"> AI Automation </a>
          <a routerLink="/services/digital-marketing" (click)="closeMenu()"> Digital Marketing </a>
          <a routerLink="/services/support-maintenance" (click)="closeMenu()">
            Support & Maintenance
          </a>
          <a routerLink="/services/ui-ux-design" (click)="closeMenu()"> UI/UX Design </a>
          <a routerLink="/services/web-development" (click)="closeMenu()"> Web Development </a>
        </div>
      </div>

      <a routerLink="/blog" routerLinkActive="active" (click)="closeMenu()"> Blog </a>

      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"> Contact Us</a>
    </nav>

    <div class="header-actions">
      <a routerLink="/contact" class="btn btn-primary"> Get Started </a>

      <button
        class="menu-toggle"
        [class.active]="mobileMenuOpen()"
        (click)="toggleMenu()"
        aria-label="Toggle menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
