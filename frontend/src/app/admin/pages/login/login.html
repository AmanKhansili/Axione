<div class="login-page">
  <div class="login-card">
    <h1>Axione Admin</h1>

    <p>Welcome Back 👋</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>

        <input type="email" [(ngModel)]="email" name="email" placeholder="Enter Email" required />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter Password"
          required
        />
      </div>

      <button type="submit" [disabled]="isLoading">
        @if (isLoading) {
          Logging In...
        } @else {
          Login
        }
      </button>
    </form>
  </div>
</div>
