<div class="login-page">
  <div class="login-glow login-glow-one"></div>
  <div class="login-glow login-glow-two"></div>

  <div class="login-card">
    <div class="brand-mark">
      <img src="/axione-solutions-logo-LLC.png" alt="Axione Solutions" />
    </div>

    <div class="login-heading">
      <span>ADMIN PORTAL</span>
      <h1>Welcome Back</h1>
      <p>Sign in to manage your Axione Solutions website.</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="ri-mail-line"></i>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="ri-lock-2-line"></i>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
          </button>
        </div>
      </div>

      <button class="login-button" type="submit" [disabled]="isLoading">
        @if (isLoading) {
          <span class="spinner"></span>
          Signing In...
        } @else {
          Sign In
          <i class="ri-arrow-right-line"></i>
        }
      </button>
    </form>

    <div class="login-footer">
      <i class="ri-shield-check-line"></i>
      Secure access powered by Supabase Auth
    </div>
  </div>
</div>
